context:
  version: "0.1.1"

package:
  name: spaday-vega
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-vega/spaday_vega-${{ version }}.tar.gz
  sha256: cfb7800df5f14958a3cdaf291408baf5063bec6f69ab5d747e24a80f63989627

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.8.2,<1

tests:
  - python:
      imports:
        - spaday_vega
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Vega and Vega-Lite visualizations for spaday
  homepage: https://github.com/1kbgz/spaday-vega
  repository: https://github.com/1kbgz/spaday-vega

extra:
  recipe-maintainers:
    - timkpaine
